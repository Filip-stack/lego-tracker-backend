<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Star Wars Price Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-section {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 hero-section">
            <div class="logo-placeholder">🚀🧱</div>
            <h1 class="fw-bold mb-3">LEGO Star Wars Price Tracker</h1>
            <p class="text-muted mb-4">
                Nasz system porównywania cen i śledzenia najlepszych ofert dla kolekcjonerów zestawów LEGO Star Wars jest obecnie w fazie budowy.
            </p>
            <div class="alert alert-primary" role="alert">
                <strong>Status:</strong> Integracja z sieciami afiliacyjnymi i API sklepów w toku. Wkrótce startujemy!
            </div>
        </div>
    </div>
</div>

</body>
</html>
