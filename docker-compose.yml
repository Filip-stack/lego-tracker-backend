version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lego_postgres
    restart: always
    environment:
      # wartosci z pliku .env (docker-compose czyta go automatycznie)
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ustaw DB_PASSWORD w pliku .env}
      POSTGRES_DB: lego_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: