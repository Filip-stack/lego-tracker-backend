version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lego_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lego_password
      POSTGRES_DB: lego_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: