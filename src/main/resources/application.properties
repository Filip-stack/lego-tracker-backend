# sekrety czytamy ze zmiennych srodowiskowych albo z lokalnego pliku .env (nie trafia do gita),
# wzor w .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lego_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
rebrickable.api.key=${REBRICKABLE_API_KEY}
